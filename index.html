<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Web Page</title>
    <link rel="stylesheet" href="styles.css"> 
    <scripts type="module" src="scripts/main.js"></scripts>
</head> 

<body>

    <div class="Contact-form">
        <h2>Contact Form</h2>
        <form action="/" id="contact-form">  
            <label for="fname">Name</label>
            <input type="text" id="fname" name="fname" placeholder="Enter your name" required>
<br>
            <label for="lname">Surname</label>
            <input type="text" id="lname" name="lname" placeholder="Enter your surname" required>
<br>
            
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>
<br>

            <label for="subject">Subject</label>
            <input type="text" id="subject" name="subject" placeholder="Enter your subject" required>
<br>
            <label for="message">Message</label>
            <textarea id="message" rows="5" name="message"   placeholder="Write your message here" required></textarea>
<br>

            <button type="submit">Submit</button>
        </form>
    </div>

</body>
<script type="module" src="Scripts/formsubmit.js"></script>
</html>
