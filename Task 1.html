<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Web Page</title>
    <link rel="stylesheet" href="styles.css"> 
</head> 
<body>

    <div class="Contact-form">
        <h2>Contact Form</Form></h2>
        <form action="#">
            <label for="fname">Name</label>
            <input type="text" id="fname" placeholder="Enter your name" required>
<br>
            <label for="lname">Surname</label>
            <input type="text" id="lname" placeholder="Enter your surname" required>
<br>
            
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter your email" required>
<br>

            <label for="subject">Subject</label>
            <input type="text" id="subject" placeholder="Enter your subject" required>
<br>
            <label for="message">Message</label>
            <textarea id="message" rows="5" placeholder="Write your message here" required></textarea>
<br>

            <button type="submit">Submit</button>
        </form>
    </div>

</body>
</html>
